name: Build Android APK (Honor 400 Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Permanent Signing Keystore
        uses: actions/cache@v4
        with:
          path: release.jks
          key: hd2020-ledstudio-permanent-keystore-v1

      - name: Recreate Clean Android Project
        working-directory: ./led_matrix_app
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.ledstudio
          cp android_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/ledstudio/led_matrix_app
          cp android_custom/MainActivity.kt android/app/src/main/kotlin/com/ledstudio/led_matrix_app/MainActivity.kt

      - name: Install Dependencies
        working-directory: ./led_matrix_app
        run: flutter pub get

      - name: Build Release and Debug APK
        working-directory: ./led_matrix_app
        run: |
          mkdir -p ../build_output
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee ../build_output/build.log

      - name: Sign Release APK with apksigner (V1 + V2 + V3)
        run: |
          mkdir -p build_output
          cp ./led_matrix_app/build/app/outputs/flutter-apk/app-release.apk ./build_output/HD2020_LED_Studio_Honor.apk
          cp ./led_matrix_app/build/app/outputs/flutter-apk/app-release.apk ./build_output/HD2020_LED_Studio_Debug.apk

          # Generate signing keystore only if not restored from cache
          if [ ! -f release.jks ]; then
            keytool -genkey -v -keystore release.jks -alias ledstudio -storepass android123 -keypass android123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=HD2020 Studio,OU=Mobile,O=LED Studio,L=Hanoi,ST=HN,C=VN"
          fi

          # Find apksigner in Android build tools
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Found apksigner at: $APKSIGNER"

          # Sign APK with v1 (JAR signing), v2, and v3
          $APKSIGNER sign --ks release.jks --ks-pass pass:android123 --ks-key-alias ledstudio --key-pass pass:android123 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true ./build_output/HD2020_LED_Studio_Honor.apk

          # Verify signature
          echo "=== VERIFYING RELEASE APK SIGNATURE ==="
          $APKSIGNER verify --verbose ./build_output/HD2020_LED_Studio_Honor.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HD2020_LED_Studio_APKs
          path: ./build_output/*.apk

      - name: Create Direct Download Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HD2020 LED Studio Mobile v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            ./build_output/HD2020_LED_Studio_Honor.apk
            ./build_output/HD2020_LED_Studio_Debug.apk
            ./build_output/build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
