name: Build Android APK (Honor 400 Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Android Project
        working-directory: ./led_matrix_app
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.ledstudio
          
          # 1. Ghi de file AndroidManifest.xml co du quyen ket noi mang
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />

              <application
                  android:label="LED Studio"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          # 2. Ghi de file MainActivity.kt voi day du code dieu khien WiFi ngam tren Android 14
          cat << 'EOF' > android/app/src/main/kotlin/com/ledstudio/led_matrix_app/MainActivity.kt
          package com.ledstudio.led_matrix_app

          import android.content.Context
          import android.net.ConnectivityManager
          import android.net.Network
          import android.net.NetworkCapabilities
          import android.net.NetworkRequest
          import android.net.wifi.WifiNetworkSpecifier
          import android.os.Build
          import androidx.annotation.NonNull
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.ledmatrix.wifi"
              private var connectivityManager: ConnectivityManager? = null
              private var currentCallback: ConnectivityManager.NetworkCallback? = null

              override fun configureFlutterEngine(@NonNull flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  connectivityManager = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "connectWifi" -> {
                              val ssid = call.argument<String>("ssid") ?: ""
                              val password = call.argument<String>("password") ?: "88888888"
                              connectToWifi(ssid, password, result)
                          }
                          "disconnectWifi" -> {
                              disconnectWifi()
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun connectToWifi(ssid: String, pass: String, result: MethodChannel.Result) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      try {
                          disconnectWifi()

                          val specifier = WifiNetworkSpecifier.Builder()
                              .setSsid(ssid)
                              .setWpa2Passphrase(pass)
                              .build()

                          val request = NetworkRequest.Builder()
                              .addTransportType(NetworkCapabilities.TRANSPORT_WIFI)
                              .removeCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                              .setNetworkSpecifier(specifier)
                              .build()

                          var hasResponded = false
                          val callback = object : ConnectivityManager.NetworkCallback() {
                              override fun onAvailable(network: Network) {
                                  super.onAvailable(network)
                                  connectivityManager?.bindProcessToNetwork(network)
                                  if (!hasResponded) {
                                      hasResponded = true
                                      runOnUiThread { result.success(true) }
                                  }
                              }

                              override fun onUnavailable() {
                                  super.onUnavailable()
                                  if (!hasResponded) {
                                      hasResponded = true
                                      runOnUiThread { result.success(false) }
                                  }
                              }

                              override fun onLost(network: Network) {
                                  super.onLost(network)
                                  connectivityManager?.bindProcessToNetwork(null)
                              }
                          }

                          currentCallback = callback
                          connectivityManager?.requestNetwork(request, callback, 10000)

                      } catch (e: Exception) {
                          result.error("WIFI_ERR", e.message, null)
                      }
                  } else {
                      result.success(true)
                  }
              }

              private fun disconnectWifi() {
                  try {
                      currentCallback?.let {
                          connectivityManager?.unregisterNetworkCallback(it)
                          connectivityManager?.bindProcessToNetwork(null)
                          currentCallback = null
                      }
                  } catch (_: Exception) {}
              }
          }
          EOF

      - name: Install Dependencies
        working-directory: ./led_matrix_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./led_matrix_app
        run: flutter build apk --release

      - name: Prepare Output
        run: |
          mkdir -p build_output
          cp ./led_matrix_app/build/app/outputs/flutter-apk/app-release.apk ./build_output/HD2020_LED_Studio_Honor.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HD2020_LED_Studio_Honor_APK
          path: ./build_output/HD2020_LED_Studio_Honor.apk
