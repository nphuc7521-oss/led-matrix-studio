name: Build Android APK (Honor 400 Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Android Project
        working-directory: ./led_matrix_app
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.ledstudio
          rm -f android/app/build.gradle*
          cp android_custom/app_build.gradle android/app/build.gradle
          cp android_custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/ledstudio/led_matrix_app
          cp android_custom/MainActivity.kt android/app/src/main/kotlin/com/ledstudio/led_matrix_app/MainActivity.kt

      - name: Install Dependencies
        working-directory: ./led_matrix_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./led_matrix_app
        run: flutter build apk --release --verbose

      - name: Prepare Output
        run: |
          mkdir -p build_output
          cp ./led_matrix_app/build/app/outputs/flutter-apk/app-release.apk ./build_output/HD2020_LED_Studio_Honor.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HD2020_LED_Studio_Honor_APK
          path: ./build_output/HD2020_LED_Studio_Honor.apk

      - name: Create Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HD2020 LED Studio Mobile v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: ./build_output/HD2020_LED_Studio_Honor.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
