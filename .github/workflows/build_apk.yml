name: Build Android APK (Honor 400 Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Clean Android Project
        working-directory: ./led_matrix_app
        run: |
          mkdir -p /tmp/backup
          cp -f android/app/src/main/kotlin/com/ledstudio/led_matrix_app/MainActivity.kt /tmp/backup/MainActivity.kt || true
          rm -rf android
          flutter create . --platforms=android --org com.ledstudio
          cp -f /tmp/backup/MainActivity.kt android/app/src/main/kotlin/com/ledstudio/led_matrix_app/MainActivity.kt || true
          
          # Them quyen mang va WiFi vao AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />' android/app/src/main/AndroidManifest.xml
          
          # Bat usesCleartextTraffic
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        working-directory: ./led_matrix_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: ./led_matrix_app
        run: flutter build apk --release

      - name: Prepare Output
        run: |
          mkdir -p build_output
          cp ./led_matrix_app/build/app/outputs/flutter-apk/app-release.apk ./build_output/HD2020_LED_Studio_Honor.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HD2020_LED_Studio_Honor_APK
          path: ./build_output/HD2020_LED_Studio_Honor.apk
